# StatusFlare: extracted and adapted from the UptimeFlare full-stack derivative; see NOTICE.
name: Deploy StatusFlare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
      ACCESS_AUD: ${{ vars.ACCESS_AUD }}
      ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
      ENABLE_R2: ${{ vars.ENABLE_R2 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Generate deployment configuration
        run: node scripts/configure-deploy.mjs
      - name: Validate Worker bundle
        run: npx wrangler deploy --config wrangler.deploy.toml --dry-run --outdir dist-worker
      - name: Apply additive D1 migrations
        run: npx wrangler d1 migrations apply STATUSFLARE_D1 --remote --config wrangler.deploy.toml
      - name: Deploy Worker and static assets
        run: npx wrangler deploy --config wrangler.deploy.toml
